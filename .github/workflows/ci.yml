name: CI

on:
  push:
    branches: ["main", "dev/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - run: go vet ./...

      - run: go test ./...

      - name: Package
        run: go run ./scripts/package -out dist -release-url "https://github.com/$GITHUB_REPOSITORY/releases/download/ci"
