<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pushover · Silo</title>
  <style>
    :root {
      --bg: #0e1014; --surface: #161920; --surface-2: #1d212a; --border: #2a2f3a;
      --text: #e7e9ee; --muted: #98a1b0; --accent: #3b8cff; --accent-text: #fff;
      --ok: #3fb950; --warn: #d29922; --danger: #f06a6a; --focus: #7fb2ff;
      --radius: 14px; color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #f5f6f8; --surface: #fff; --surface-2: #f0f2f5; --border: #dde1e7;
      --text: #171a20; --muted: #5d6675; --accent: #1f6fe5; --ok: #1a7f37; --warn: #9a6700;
      --danger: #c62828; --focus: #1f6fe5; color-scheme: light;
    }
    @media (prefers-color-scheme: light) {
      :root[data-theme="auto"] {
        --bg: #f5f6f8; --surface: #fff; --surface-2: #f0f2f5; --border: #dde1e7;
        --text: #171a20; --muted: #5d6675; --accent: #1f6fe5; --ok: #1a7f37; --warn: #9a6700;
        --danger: #c62828; --focus: #1f6fe5; color-scheme: light;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 120px; }
    a { color: var(--accent); }
    .back { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); text-decoration: none; font-size: 14px; }
    .back:hover { color: var(--text); }
    h1 { font-size: 26px; margin: 12px 0 4px; letter-spacing: -0.01em; }
    h2 { font-size: 17px; margin: 0 0 4px; }
    .lede { color: var(--muted); margin: 0 0 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
    .card > .sub { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
    .notice { border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; border: 1px solid var(--border); background: var(--surface); }
    .notice.warn { border-color: color-mix(in srgb, var(--warn) 55%, var(--border)); }
    .notice.error { border-color: color-mix(in srgb, var(--danger) 55%, var(--border)); }
    .notice strong { display: block; margin-bottom: 2px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .tab { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 6px 14px; cursor: pointer; font: inherit; font-size: 14px; }
    .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .tab .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-left: 6px; vertical-align: middle; }
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    .lbl { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    .help { color: var(--muted); font-size: 13px; margin-top: 6px; }
    input[type="text"], input[type="password"], input[type="number"], select, textarea {
      width: 100%; background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 9px 12px; font: inherit;
    }
    textarea { resize: vertical; min-height: 64px; }
    input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible, .tab:focus-visible {
      outline: 2px solid var(--focus); outline-offset: 2px;
    }
    .row { display: flex; gap: 8px; align-items: center; }
    .row > input { flex: 1; min-width: 0; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    button.btn { font: inherit; font-size: 14px; font-weight: 600; border-radius: 10px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); white-space: nowrap; }
    button.btn:hover { border-color: var(--muted); }
    button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    button.btn.danger { color: var(--danger); }
    button.btn:disabled { opacity: 0.55; cursor: default; }
    button.link { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; }
    .switch { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
    .switch input { appearance: none; flex: none; width: 38px; height: 22px; border-radius: 999px; background: var(--border); position: relative; cursor: pointer; margin: 1px 0 0; transition: background .15s; }
    .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
    .switch input:checked { background: var(--accent); }
    .switch input:checked::after { transform: translateX(16px); }
    .switch .t { font-weight: 600; font-size: 14px; }
    .switch .d { color: var(--muted); font-size: 13px; }
    .checks { display: grid; gap: 12px; }
    .status-ok { color: var(--ok); }
    .status-err { color: var(--danger); }
    .type { border-top: 1px solid var(--border); padding: 16px 0; }
    .type:first-of-type { border-top: 0; padding-top: 4px; }
    .type:last-child { padding-bottom: 0; }
    details > summary { cursor: pointer; color: var(--accent); font-size: 13px; margin: 10px 0 0 50px; list-style: none; width: fit-content; }
    details > summary::-webkit-details-marker { display: none; }
    details[open] > summary { margin-bottom: 12px; }
    .editor { margin-left: 50px; }
    @media (max-width: 640px) { .editor, details > summary { margin-left: 0; } }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 2px 7px; cursor: pointer; }
    .chip:hover { border-color: var(--accent); }
    .preview { margin-top: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
    .preview .pl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
    .preview .pt { font-weight: 600; }
    .preview .pm { white-space: pre-wrap; overflow-wrap: anywhere; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--border); }
    .bar .in { max-width: 760px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 8px; align-items: center; }
    .bar .msg { flex: 1; font-size: 14px; color: var(--muted); min-width: 0; }
    .skeleton { height: 160px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); }
    h3 { font-size: 15px; margin: 20px 0 8px; }
    .badge { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: middle; }
    .keylist { list-style: none; margin: 0 0 4px; padding: 0; display: grid; gap: 4px; font-size: 14px; }
    .muted { color: var(--muted); }
    .notice.ok { border-color: color-mix(in srgb, var(--ok) 55%, var(--border)); }
    .notice ul { margin: 6px 0 0; padding-left: 20px; }
    .notice .actions { margin-top: 10px; }
    .card .notice { margin: 16px 0 0; }
    .narrow { max-width: 160px; }
    .limit { margin: 10px 0 0 50px; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; font-size: 14px; }
    .limit input[type="number"] { width: 110px; }
    .limit .switch { flex-basis: 100%; margin-top: 4px; }
    @media (max-width: 640px) { .limit { margin-left: 0; } }
    .nosw { margin-left: 50px; font-size: 14px; }
    .nosw .t { font-weight: 600; }
    .nosw .d { color: var(--muted); font-size: 13px; }
    @media (max-width: 640px) { .nosw { margin-left: 0; } }
    .setup pre { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; overflow: auto; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .setup ol { padding-left: 20px; margin: 8px 0; }
    .group-sub { margin: -4px 0 4px; }
    fieldset.field { border: 0; padding: 0; margin: 0 0 16px; min-width: 0; }
    fieldset.field legend { padding: 0; }
    .pick { border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); padding: 6px 12px; max-height: 200px; overflow: auto; }
    .pick.inline { max-height: none; display: flex; flex-wrap: wrap; gap: 0 20px; }
    .pick label { display: flex; gap: 8px; align-items: center; padding: 5px 0; font-size: 14px; cursor: pointer; }
    .choice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; margin-bottom: 8px; }
    .choice:has(input:checked) { border-color: var(--accent); }
    .choice input { margin-top: 4px; accent-color: var(--accent); flex: none; }
    .choice .t { font-weight: 600; font-size: 14px; }
    .choice .d { color: var(--muted); font-size: 13px; }
    details.plain > summary { margin: 12px 0 0; }
    details.plain[open] > summary { margin-bottom: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <a class="back" href="/">← Back to Silo</a>
  <h1>Pushover</h1>
  <p class="lede">Get your Silo notifications on your phone, tablet or desktop through <a href="https://pushover.net" target="_blank" rel="noopener">Pushover</a>.</p>
  <div id="notice"></div>
  <div id="app"><div class="skeleton"></div></div>
  <div id="admin"></div>
</main>
<div class="bar" id="bar" hidden>
  <div class="in">
    <div class="msg" id="barMsg" role="status" aria-live="polite"></div>
    <button class="btn danger" id="removeBtn" type="button" hidden>Remove</button>
    <button class="btn primary" id="saveBtn" type="button">Save</button>
  </div>
</div>

<script>
(() => {
  const root = document.documentElement;
  if (root.dataset.theme === "auto") {
    const t = (new URLSearchParams(location.search).get("theme") || "").toLowerCase();
    if (t) root.dataset.theme = t.includes("light") ? "light" : "dark";
  }

  const PRIORITIES = [
    { value: -2, label: "Lowest: no alert" },
    { value: -1, label: "Low: no sound or vibration" },
    { value: 0, label: "Normal" },
    { value: 1, label: "High: bypasses quiet hours" },
  ];

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  let state = null, profileId = null, view = null, draft = null;
  let devices = [], sounds = [], lastField = null, dirty = false, expired = false;

  async function api(path, method = "GET", body) {
    const opts = { method, credentials: "same-origin", headers: { Accept: "application/json" } };
    if (body !== undefined) {
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    let res;
    try { res = await fetch(path, opts); } catch { throw new Error("Couldn't reach Silo. Check your connection and try again."); }
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) { sessionExpired(); throw new Error(data.message || "Session expired."); }
    if (!res.ok) {
      const err = new Error(data.message || `Request failed (${res.status}).`);
      err.code = data.code || "";
      throw err;
    }
    return data;
  }

  function notice(kind, title, text) {
    $("#notice").innerHTML = title ? `<div class="notice ${kind}"><strong>${esc(title)}</strong>${esc(text)}</div>` : "";
  }

  function sessionExpired() {
    expired = true;
    notice("warn", "This page's sign-in has expired.", " For security it only lasts a few minutes. Open Pushover from the Silo sidebar again to keep going. Unsaved changes on this page will be lost.");
    $$("#app input, #app select, #app textarea, #app button, #bar button, #admin input, #admin select, #admin textarea, #admin button").forEach((e) => (e.disabled = true));
  }

  function barMessage(text, kind) {
    const m = $("#barMsg");
    m.textContent = text || "";
    m.className = "msg" + (kind ? " status-" + kind : "");
  }

  function markDirty() {
    dirty = true;
    barMessage("Unsaved changes");
  }

  // Mirrors renderTemplate in templates.go.
  function render(tmpl, vars) {
    return (tmpl || "").replace(/\r\n/g, "\n").split("\n").map((line) => {
      if (!line.trim()) return "";
      const out = line.replace(/\{([a-z_]+)\}/g, (m, k) => (k in vars ? vars[k] : m));
      // A value can hold several lines (a list of streams); tidy each.
      return out.split("\n").map(tidy).filter(Boolean).join("\n") || null;
    }).filter((l) => l !== null).join("\n").trim();
  }
  function tidy(line) {
    const seps = " \t·•|,:–—";
    line = line.replace(/\(\)|\[\]/g, "").split(/\s+/).filter(Boolean).join(" ");
    let a = 0, b = line.length;
    while (a < b && seps.includes(line[a])) a++;
    while (b > a && (seps + "-").includes(line[b - 1])) b--;
    return line.slice(a, b);
  }

  function sampleVars(type) {
    const p = state.profiles.find((x) => x.id === profileId);
    return { profile: p ? p.name : "", type: type.key, type_label: type.label, ...type.sample };
  }

  async function init() {
    try {
      state = await api("api/state");
    } catch (e) {
      if (!expired) { $("#app").innerHTML = ""; notice("error", "Couldn't load Pushover settings.", " " + e.message); }
      return;
    }
    if (state.problem) {
      $("#app").innerHTML = "";
      notice("warn", "Pushover isn't ready yet.", " " + state.problem.message);
      return;
    }
    if (state.notice) notice(state.notice.level === "warn" ? "warn" : "info", state.notice.title, " " + state.notice.message);
    sounds = state.sounds;
    renderAdmin();
    const active = state.profiles.find((p) => p.active) || state.profiles[0];
    profileId = active.id;
    await loadProfile();
  }

  async function loadProfile() {
    $("#app").innerHTML = `<div class="skeleton"></div>`;
    try {
      view = await api("api/profiles/" + encodeURIComponent(profileId));
    } catch (e) {
      if (!expired) notice("error", "Couldn't load this profile.", " " + e.message);
      return;
    }
    draft = JSON.parse(JSON.stringify(view));
    draft.user_key = ""; draft.app_token = ""; draft.clear_app_token = false;
    devices = view.device ? view.device.split(",") : [];
    sounds = state.sounds;
    dirty = false;
    renderAll();
    barMessage(view.configured ? "" : "Not set up yet");
  }

  function renderTabs() {
    if (state.profiles.length < 2) return "";
    return `<div class="tabs" role="tablist" aria-label="Profiles">${state.profiles.map((p) =>
      `<button class="tab" role="tab" type="button" data-profile="${esc(p.id)}" aria-selected="${p.id === profileId}">${esc(p.name)}${p.enabled ? '<span class="dot" title="Pushover is on"></span>' : ""}</button>`).join("")}</div>`;
  }

  function soundOptions(selected, emptyLabel) {
    const list = [...sounds];
    if (selected && !list.some((s) => s.value === selected)) list.push({ value: selected, label: selected });
    return `<option value="">${esc(emptyLabel)}</option>` + list.map((s) =>
      `<option value="${esc(s.value)}"${s.value === selected ? " selected" : ""}>${esc(s.label)}</option>`).join("");
  }

  function priorityOptions(selected, inherit, inheritLabel = "Same as default") {
    const first = inherit ? `<option value=""${selected == null ? " selected" : ""}>${esc(inheritLabel)}</option>` : "";
    return first + PRIORITIES.map((p) => `<option value="${p.value}"${p.value === selected ? " selected" : ""}>${esc(p.label)}</option>`).join("");
  }

  function deviceOptions() {
    const current = draft.device;
    const list = [...new Set([...devices, ...(current && !current.includes(",") ? [current] : [])])];
    return `<option value="">All my devices</option>` + list.map((d) =>
      `<option value="${esc(d)}"${d === current ? " selected" : ""}>${esc(d)}</option>`).join("");
  }

  function renderAll() {
    const tokenHelp = state.has_default_token
      ? "Optional. Leave blank to use this server's shared Pushover application."
      : `Required. This server has no shared application, so <a href="https://pushover.net/apps/build" target="_blank" rel="noopener">create one on Pushover</a> and paste its API token.`;
    const keyPlaceholder = view.user_key_hint ? `Saved (${view.user_key_hint}). Enter a new key to replace it.` : "30 letters and numbers";
    const tokenPlaceholder = view.app_token_hint ? `Saved (${view.app_token_hint}). Enter a new token to replace it.` : (state.has_default_token ? "Using the server's application" : "30 letters and numbers");

    $("#app").innerHTML = `
      ${renderTabs()}
      <section class="card">
        <h2>Pushover account</h2>
        <p class="sub">Settings for <strong>${esc(view.profile_name)}</strong>. Find your user key at the top of <a href="https://pushover.net" target="_blank" rel="noopener">pushover.net</a> after you sign in.</p>
        <div class="field">
          <label class="switch"><input type="checkbox" id="enabled" role="switch"${draft.enabled ? " checked" : ""}>
            <span><span class="t">Send this profile's notifications to Pushover</span></span></label>
        </div>
        <div class="field">
          <label class="lbl" for="userKey">User key</label>
          <div class="row">
            <input type="password" id="userKey" autocomplete="off" spellcheck="false" placeholder="${esc(keyPlaceholder)}">
            <button class="btn" type="button" id="checkBtn">Check key</button>
          </div>
          <div class="help" id="checkMsg" role="status" aria-live="polite">Checking lists your devices and custom sounds.</div>
        </div>
        <div class="field">
          <label class="lbl" for="appToken">Application token</label>
          <input type="password" id="appToken" autocomplete="off" spellcheck="false" placeholder="${esc(tokenPlaceholder)}">
          <div class="help">${tokenHelp}${view.app_token_hint ? ` <button class="link" type="button" id="clearToken">${draft.clear_app_token ? "Keep my saved token" : "Remove my saved token"}</button>` : ""}</div>
        </div>
        <div class="grid">
          <div class="field"><label class="lbl" for="device">Device</label><select id="device">${deviceOptions()}</select></div>
          <div class="field"><label class="lbl" for="sound">Sound</label><select id="sound">${soundOptions(draft.sound, "Pushover app default")}</select></div>
          <div class="field"><label class="lbl" for="priority">Priority</label><select id="priority">${priorityOptions(draft.priority, false)}</select></div>
        </div>
        <div class="checks">
          <label class="switch"><input type="checkbox" id="includeLink"${draft.include_link ? " checked" : ""}>
            <span><span class="t">Add an "Open in Silo" link</span><br><span class="d">Opens the episode or title in Silo.</span></span></label>
          <label class="switch"><input type="checkbox" id="attachPoster"${draft.attach_poster ? " checked" : ""}>
            <span><span class="t">Attach the poster</span><br><span class="d">Shows artwork in the notification when Silo has it.</span></span></label>
          <label class="switch"><input type="checkbox" id="html"${draft.html ? " checked" : ""}>
            <span><span class="t">Allow HTML in messages</span><br><span class="d">Lets your templates use &lt;b&gt;, &lt;i&gt;, &lt;u&gt;, &lt;font color&gt; and &lt;a&gt;.</span></span></label>
        </div>
      </section>
      <section class="card">
        <h2>Notifications</h2>
        <p class="sub">Choose what to receive and how each one reads. Which episodes count as new follows your New Episode Notifications settings in Silo.</p>
        ${state.types.map(renderType).join("")}
      </section>`;

    $("#bar").hidden = false;
    $("#removeBtn").hidden = !view.configured;
    bind();
    state.types.forEach(updatePreview);
  }

  function renderType(t) {
    const ts = draft.types[t.key];
    const id = t.key.replace(/\W/g, "_");
    return `
      <div class="type" data-type="${esc(t.key)}">
        <label class="switch"><input type="checkbox" data-k="enabled"${ts.enabled ? " checked" : ""}>
          <span><span class="t">${esc(t.label)}</span><br><span class="d">${esc(t.description)}</span></span></label>
        <details>
          <summary>Customize wording</summary>
          <div class="editor">
            <div class="field"><label class="lbl" for="${id}_title">Title</label>
              <input type="text" id="${id}_title" data-k="title" value="${esc(ts.title)}"></div>
            <div class="field"><label class="lbl" for="${id}_message">Message</label>
              <textarea id="${id}_message" data-k="message" rows="2">${esc(ts.message)}</textarea>
              <div class="chips" aria-label="Insert a placeholder">${t.placeholders.map((p) => `<button class="chip" type="button" data-insert="{${esc(p)}}">{${esc(p)}}</button>`).join("")}</div>
            </div>
            <div class="grid">
              <div class="field"><label class="lbl" for="${id}_priority">Priority</label>
                <select id="${id}_priority" data-k="priority">${priorityOptions(ts.priority ?? null, true)}</select></div>
              <div class="field"><label class="lbl" for="${id}_sound">Sound</label>
                <select id="${id}_sound" data-k="sound">${soundOptions(ts.sound || "", "Same as default")}</select></div>
            </div>
            <div class="preview" aria-live="polite"><div class="pl">Preview with sample data</div><div class="pt"></div><div class="pm"></div></div>
            <div class="actions">
              <button class="btn" type="button" data-test>Send test</button>
              <button class="link" type="button" data-reset>Reset wording</button>
              <span class="help" data-test-msg role="status" aria-live="polite"></span>
            </div>
          </div>
        </details>
      </div>`;
  }

  function updatePreview(t) {
    const box = $(`#app .type[data-type="${CSS.escape(t.key)}"]`);
    if (!box) return;
    const ts = draft.types[t.key];
    const vars = sampleVars(t);
    $(".pt", box).textContent = render(ts.title, vars) || "(no title)";
    $(".pm", box).textContent = render(ts.message, vars) || "(no message)";
  }

  function bind() {
    $$(".tab").forEach((b) => b.addEventListener("click", async () => {
      if (b.dataset.profile === profileId) return;
      if (dirty && !confirm("Discard unsaved changes to this profile?")) return;
      profileId = b.dataset.profile;
      await loadProfile();
    }));

    const on = (sel, ev, fn) => { const e = $(sel); if (e) e.addEventListener(ev, fn); };
    on("#enabled", "change", (e) => { draft.enabled = e.target.checked; markDirty(); });
    on("#userKey", "input", (e) => { draft.user_key = e.target.value.trim(); markDirty(); });
    on("#appToken", "input", (e) => { draft.app_token = e.target.value.trim(); markDirty(); });
    on("#device", "change", (e) => { draft.device = e.target.value; markDirty(); });
    on("#sound", "change", (e) => { draft.sound = e.target.value; markDirty(); });
    on("#priority", "change", (e) => { draft.priority = Number(e.target.value); markDirty(); });
    on("#includeLink", "change", (e) => { draft.include_link = e.target.checked; markDirty(); });
    on("#attachPoster", "change", (e) => { draft.attach_poster = e.target.checked; markDirty(); });
    on("#html", "change", (e) => { draft.html = e.target.checked; markDirty(); });
    on("#clearToken", "click", (e) => {
      draft.clear_app_token = !draft.clear_app_token;
      e.target.textContent = draft.clear_app_token ? "Keep my saved token" : "Remove my saved token";
      markDirty();
    });
    on("#checkBtn", "click", checkKey);

    $$("#app .type").forEach((box) => {
      const t = state.types.find((x) => x.key === box.dataset.type);
      const ts = draft.types[t.key];
      $$("[data-k]", box).forEach((input) => {
        const k = input.dataset.k;
        const ev = input.tagName === "SELECT" || input.type === "checkbox" ? "change" : "input";
        input.addEventListener(ev, () => {
          if (k === "enabled") ts.enabled = input.checked;
          else if (k === "priority") ts.priority = input.value === "" ? null : Number(input.value);
          else ts[k] = input.value;
          markDirty();
          updatePreview(t);
        });
        if (k === "title" || k === "message") input.addEventListener("focus", () => (lastField = input));
      });
      $$("[data-insert]", box).forEach((chip) => chip.addEventListener("click", () => {
        const target = lastField && box.contains(lastField) ? lastField : $("[data-k=message]", box);
        const s = target.selectionStart ?? target.value.length, e = target.selectionEnd ?? s;
        target.value = target.value.slice(0, s) + chip.dataset.insert + target.value.slice(e);
        target.focus();
        target.setSelectionRange(s + chip.dataset.insert.length, s + chip.dataset.insert.length);
        target.dispatchEvent(new Event("input"));
      }));
      $("[data-reset]", box).addEventListener("click", () => {
        ts.title = t.default_title; ts.message = t.default_message;
        $("[data-k=title]", box).value = ts.title;
        $("[data-k=message]", box).value = ts.message;
        markDirty();
        updatePreview(t);
      });
      $("[data-test]", box).addEventListener("click", (e) => sendTest(t, e.target, $("[data-test-msg]", box)));
    });
  }

  function payload() {
    return {
      enabled: draft.enabled, user_key: draft.user_key, app_token: draft.app_token,
      clear_app_token: draft.clear_app_token, device: draft.device, sound: draft.sound,
      priority: draft.priority, html: draft.html, attach_poster: draft.attach_poster,
      include_link: draft.include_link, types: draft.types,
    };
  }

  async function checkKey() {
    const msg = $("#checkMsg"), btn = $("#checkBtn");
    btn.disabled = true;
    msg.className = "help"; msg.textContent = "Checking with Pushover…";
    try {
      const res = await api(`api/profiles/${encodeURIComponent(profileId)}/validate`, "POST",
        { user_key: draft.user_key, app_token: draft.clear_app_token ? "" : draft.app_token, clear_app_token: draft.clear_app_token });
      devices = res.devices; sounds = res.sounds;
      $("#device").innerHTML = deviceOptions();
      $("#sound").innerHTML = soundOptions(draft.sound, "Pushover app default");
      state.types.forEach((t) => {
        const sel = $(`#app .type[data-type="${CSS.escape(t.key)}"] [data-k=sound]`);
        if (sel) sel.innerHTML = soundOptions(draft.types[t.key].sound || "", "Same as default");
      });
      msg.className = "help status-ok";
      msg.textContent = devices.length ? `Key works. Devices: ${devices.join(", ")}.` : "Key works. No devices are registered yet; install the Pushover app to receive messages.";
    } catch (e) {
      if (!expired) { msg.className = "help status-err"; msg.textContent = e.message; }
    } finally {
      btn.disabled = expired;
    }
  }

  async function sendTest(t, btn, out) {
    btn.disabled = true;
    out.className = "help"; out.textContent = "Sending…";
    try {
      await api(`api/profiles/${encodeURIComponent(profileId)}/test`, "POST", { settings: payload(), type: t.key });
      out.className = "help status-ok"; out.textContent = "Sent. Check your device.";
    } catch (e) {
      if (!expired) { out.className = "help status-err"; out.textContent = e.message; }
    } finally {
      btn.disabled = expired;
    }
  }

  $("#saveBtn").addEventListener("click", async () => {
    const btn = $("#saveBtn");
    btn.disabled = true;
    barMessage("Saving…");
    try {
      const res = await api("api/profiles/" + encodeURIComponent(profileId), "PUT", payload());
      const summary = state.profiles.find((p) => p.id === profileId);
      if (summary) { summary.configured = true; summary.enabled = res.profile.enabled; }
      view = res.profile;
      draft = JSON.parse(JSON.stringify(view));
      draft.user_key = ""; draft.app_token = ""; draft.clear_app_token = false;
      dirty = false;
      renderAll();
      if (res.warning) barMessage(res.warning, "err"); else barMessage("Saved", "ok");
      refreshAdminReady();
    } catch (e) {
      if (!expired) barMessage(e.message, "err");
    } finally {
      btn.disabled = expired;
    }
  });

  $("#removeBtn").addEventListener("click", async () => {
    if (!confirm(`Stop sending ${view.profile_name}'s notifications to Pushover and forget its keys?`)) return;
    try {
      await api("api/profiles/" + encodeURIComponent(profileId), "DELETE");
      const summary = state.profiles.find((p) => p.id === profileId);
      if (summary) { summary.configured = false; summary.enabled = false; }
      await loadProfile();
      barMessage("Removed", "ok");
      refreshAdminReady();
    } catch (e) {
      if (!expired) barMessage(e.message, "err");
    }
  });

  // Admin section. Only acting admins get state.admin. It has two states:
  // without a working read-only Silo key only the key setup shows; with one,
  // the alert settings show and key setup is tucked below.
  let adminData = null, adminDraft = null, adminUsers = [], adminUsersError = "";
  let adminState = "loading", adminProblem = "", adminDirty = false, adminField = null;

  const NOISE_HELP = {
    binge: {
      title: "Collapse binges (default)",
      text: "You get one alert when someone starts a show or movie. After that, everything else about that person and that title is held back until they've been idle for the time below: later episodes, pauses, resumes and stops. That includes the stop alert for a stream you were told about, so you'll rarely see one. If they start something different, or come back after the idle time, you hear about it again.",
      window: "Idle time before you hear about them again (minutes)",
      windowHelp: "How long someone must have stopped watching a title before their next start is sent.",
    },
    cooldown: {
      title: "Per-user cooldown",
      text: "Each kind of alert (started, paused or resumed, stopped) is sent at most once per person in each window, whatever they're watching. A start and a stop can both come through, but a second start from the same person inside the window is skipped.",
      window: "Cooldown (minutes)",
      windowHelp: "The shortest time between two alerts of the same kind about the same person.",
    },
    every: {
      title: "Every event",
      text: "Every start, pause, resume and stop is sent. This can get noisy on a busy server.",
    },
  };

  const KEY_PROBLEMS = {
    monitor_key_missing: "Admin alerts need the read-only Silo key. The plugin uses it to check that each person who gets alerts is still an admin. Set it up below to turn them on.",
    monitor_key_rejected: "Silo rejected the saved read-only key, so admin alerts are paused. It may have been revoked. Set up a new one below.",
    monitor_key_scope: "The saved read-only key isn't allowed to look up accounts, so admin alerts are paused. Set up a new one below.",
  };
  const isKeyProblem = (e) => e && typeof e.code === "string" && e.code.startsWith("monitor_key_");

  function renderAdmin() {
    const box = $("#admin");
    if (!state || !state.admin || !state.admin_keys) { box.innerHTML = ""; return; }
    box.innerHTML = `<div id="adminAlerts"></div><div id="adminKeys"></div>`;
    renderKeys();
    loadAdmin();
  }

  // Switches the admin section to key setup only.
  function showKeyOnly(code) {
    adminState = "key";
    adminProblem = code || "monitor_key_missing";
    adminData = null; adminDraft = null; adminDirty = false;
    $("#adminAlerts").innerHTML = "";
    renderKeys();
  }

  async function loadAdmin() {
    const box = $("#adminAlerts");
    if (!box) return;
    if (!state.admin_keys.monitor_key_set) { showKeyOnly("monitor_key_missing"); return; }
    adminState = "loading";
    box.innerHTML = `<div class="skeleton"></div>`;
    renderKeys();
    const usersReq = api("api/admin/users");
    usersReq.catch(() => {});
    try {
      adminData = await api("api/admin/alerts");
    } catch (e) {
      if (expired) return;
      if (isKeyProblem(e)) { showKeyOnly(e.code); return; }
      adminState = "error";
      box.innerHTML = `<section class="card"><h2>Admin alerts<span class="badge">Admin</span></h2>
        <div class="notice error"><strong>Couldn't load your admin alert settings.</strong> ${esc(e.message)}
          <div class="actions"><button class="btn" type="button" id="adminRetry">Try again</button></div></div></section>`;
      $("#adminRetry").addEventListener("click", loadAdmin);
      renderKeys();
      return;
    }
    adminUsers = []; adminUsersError = "";
    try {
      adminUsers = (await usersReq).users || [];
    } catch (e) {
      if (expired) return;
      if (isKeyProblem(e)) { showKeyOnly(e.code); return; }
      adminUsersError = e.message;
    }
    adminState = "ready"; adminProblem = ""; adminDirty = false;
    adminDraft = draftFrom(adminData.settings);
    renderAdminAlerts();
    renderKeys();
    adminMessage(adminData.configured ? "" : "Not set up yet. Every alert is off until you switch it on.");
  }

  function draftFrom(settings) {
    const d = JSON.parse(JSON.stringify(settings));
    d.limits = { user_streams: 0, server_streams: 0, bandwidth_mbps: 0, bandwidth_remote_only: false, disk_pct: 0, memory_pct: 0, ...(d.limits || {}) };
    d.filters.libraries = d.filters.libraries || [];
    return d;
  }

  function adminMessage(text, kind) {
    const m = $("#adminMsg");
    if (!m) return;
    m.textContent = text || "";
    m.className = "help" + (kind ? " status-" + kind : "");
  }

  function markAdminDirty() {
    adminDirty = true;
    adminMessage("Unsaved changes");
  }

  function activeProfileName() {
    const p = state.profiles.find((x) => x.active) || state.profiles[0];
    return p ? p.name : "your profile";
  }

  function readyNotice() {
    if (!adminData || adminData.pushover_ready) return "";
    return `<div class="notice warn"><strong>Set up Pushover for ${esc(activeProfileName())} first.</strong> ${esc(adminData.pushover_message || "Admin alerts are sent with your profile's Pushover settings. Add your Pushover user key in your profile's section of this page first.")}</div>`;
  }

  // After a profile save, the admin's Pushover status may have changed.
  async function refreshAdminReady() {
    if (!adminData || adminState !== "ready") return;
    try {
      const fresh = await api("api/admin/alerts");
      adminData.pushover_ready = fresh.pushover_ready;
      adminData.pushover_message = fresh.pushover_message;
      const slot = $("#adminReady");
      if (slot) slot.innerHTML = readyNotice();
    } catch (e) {
      if (isKeyProblem(e)) showKeyOnly(e.code);
    }
  }

  function renderAdminAlerts() {
    const d = adminData;
    const dr = adminDraft;
    $("#adminAlerts").innerHTML = `
      <section class="card" aria-labelledby="alertsTitle">
        <h2 id="alertsTitle">Admin alerts<span class="badge">Admin</span></h2>
        <p class="sub">Get a Pushover alert when someone plays something on your server, when streams go over the limits you set, when someone uses a new device or address, when a scan or job fails, when the server's health changes, and a weekly summary. Every alert is off until you switch it on. Alerts are sent only to you, with the Pushover settings of <strong>${esc(activeProfileName())}</strong> above; other admins set up their own. Only server admins see this section.</p>
        <div id="adminReady">${readyNotice()}</div>
        ${ALERT_GROUPS.map((g) => {
          const types = d.alert_types.filter((t) => (t.group || "playback") === g.key);
          return types.length ? `<h3>${esc(g.title)}</h3><p class="help group-sub">${esc(g.help)}</p>${g.key === "scheduled" ? scheduledSetup() : ""}<div class="alerts">${types.map(renderAlert).join("")}</div>` : "";
        }).join("")}

        <h3>Filters</h3>
        <p class="help" style="margin-top:0">Filters apply to the playback alerts. Users to ignore also applies to the alerts about one account (too many streams for one person, new device and new IP address) and leaves those people out of the weekly digest's top viewers.</p>
        <div class="checks" style="margin:12px 0 16px">
          <label class="switch"><input type="checkbox" id="fRemote"${dr.filters.only_remote ? " checked" : ""}>
            <span><span class="t">Only remote streams</span><br><span class="d">Skips streams Silo sees as local. A stream whose location Silo can't tell counts as local.</span></span></label>
          <label class="switch"><input type="checkbox" id="fTranscode"${dr.filters.only_transcodes ? " checked" : ""}>
            <span><span class="t">Only transcodes</span><br><span class="d">Skips direct play and direct stream.</span></span></label>
        </div>
        <fieldset class="field">
          <legend class="lbl">Media types</legend>
          <div class="pick inline">${mediaTypeChecks()}</div>
          <div class="help">Leave all unticked to hear about every kind of media.</div>
        </fieldset>
        <fieldset class="field">
          <legend class="lbl">Libraries</legend>
          <div class="pick inline">${libraryChecks()}</div>
          <div class="help">Leave all unticked to hear about every library. With any ticked, something Silo's catalog doesn't place in a library (audiobooks, for one) is skipped.</div>
        </fieldset>
        <div class="field">
          <label class="lbl" id="ignoreLbl">Users to ignore</label>
          <div id="userPick"></div>
          <div class="help">Nothing is sent about the people you tick, whatever they play.</div>
        </div>

        <h3>Noise</h3>
        <fieldset class="field" aria-label="Noise mode">
          ${d.noise_modes.map((m) => noiseChoice(m, dr.noise.mode)).join("")}
        </fieldset>
        <div class="field" id="noiseWindowField">
          <label class="lbl" for="noiseWindow" id="noiseWindowLbl"></label>
          <input type="number" class="narrow" id="noiseWindow" min="1" max="1440" step="1" inputmode="numeric" value="${esc(dr.noise.window_minutes || "")}">
          <div class="help" id="noiseWindowHelp"></div>
        </div>
        <p class="help">Playback failed alerts ignore the noise mode and always come through when they're switched on. Your filters still apply to them.</p>

        <div class="actions">
          <button class="btn primary" type="button" id="adminSave">Save admin alerts</button>
          <button class="btn danger" type="button" id="adminRemove"${d.configured ? "" : " hidden"}>Remove my admin alerts</button>
          <span class="help" id="adminMsg" role="status" aria-live="polite"></span>
        </div>
      </section>`;
    renderUserPick();
    syncNoiseWindow();
    bindAdminAlerts();
    d.alert_types.forEach(updateAlertPreview);
  }

  function renderAlert(t) {
    const a = adminDraft.alerts[t.key];
    const id = "al_" + t.key.replace(/\W/g, "_");
    return `
      <div class="type" data-alert="${esc(t.key)}">
        ${t.parent
          ? `<div class="nosw"><span class="t">${esc(t.label)}</span><br><span class="d">${esc(t.description)}</span></div>`
          : `<label class="switch"><input type="checkbox" data-k="enabled"${a.enabled ? " checked" : ""}>
          <span><span class="t">${esc(t.label)}</span><br><span class="d">${esc(t.description)}${t.noise_controlled || t.group !== "playback" ? "" : " Always sent when it's on, whatever the noise mode."}</span></span></label>`}
        ${(t.limits || []).map((l) => limitRow(t, l, id)).join("")}
        <details>
          <summary>Customize wording</summary>
          <div class="editor">
            <div class="field"><label class="lbl" for="${id}_title">Title</label>
              <input type="text" id="${id}_title" data-k="title" value="${esc(a.title)}"></div>
            <div class="field"><label class="lbl" for="${id}_message">Message</label>
              <textarea id="${id}_message" data-k="message" rows="3">${esc(a.message)}</textarea>
              <div class="chips" aria-label="Insert a placeholder">${t.placeholders.map((p) => `<button class="chip" type="button" data-insert="{${esc(p)}}">{${esc(p)}}</button>`).join("")}</div>
            </div>
            <div class="grid">
              <div class="field"><label class="lbl" for="${id}_priority">Priority</label>
                <select id="${id}_priority" data-k="priority">${priorityOptions(a.priority ?? null, true, "Same as my profile")}</select></div>
              <div class="field"><label class="lbl" for="${id}_sound">Sound</label>
                <select id="${id}_sound" data-k="sound">${soundOptions(a.sound || "", "Same as my profile")}</select></div>
            </div>
            <div class="preview" aria-live="polite"><div class="pl">Preview with sample data</div><div class="pt"></div><div class="pm"></div></div>
            <div class="actions">
              <button class="btn" type="button" data-test>Send test</button>
              <button class="link" type="button" data-reset>Reset wording</button>
              <span class="help" data-test-msg role="status" aria-live="polite"></span>
            </div>
          </div>
        </details>
      </div>`;
  }

  const ALERT_GROUPS = [
    { key: "playback", title: "Playback", help: "One alert per stream event. The noise mode below thins these out." },
    { key: "watchdog", title: "Watchdog", help: "Limits, and accounts showing up somewhere new. Each comes once per change, so the noise mode doesn't apply." },
    { key: "server", title: "Server problems", help: "Sent every time, whatever the noise mode." },
    { key: "scheduled", title: "Scheduled checks", help: "Silo runs these on a schedule, so they only work once the tasks are turned on (see below). Sent every time, whatever the noise mode." },
  ];

  // How to turn on the scheduled tasks. Silo runs a plugin's task only when an
  // admin binds it to a schedule, and a binding change needs a Silo restart.
  function scheduledSetup() {
    return `<details class="plain setup" id="taskSetup">
      <summary>How to turn the scheduled tasks on</summary>
      <p class="help">The switches below say who gets the alerts. Silo only runs the checks when you give them a schedule, and the plugin can't do that for you. Once, as the server admin:</p>
      <ol class="help">
        <li>Open <strong>Admin &gt; Plugins</strong> and open <strong>Pushover Notifications</strong>.</li>
        <li>Under its scheduled tasks, switch on <strong>Pushover server health check</strong> and set it to run every 5 minutes, and <strong>Pushover weekly digest</strong> set to run weekly on Sunday at 18:00 (the server's time).</li>
        <li><strong>Restart Silo.</strong> A change to a task's schedule only takes effect after a restart, and Silo says when one is needed.</li>
      </ol>
      <p class="help">Or do it with the API, using an admin API key (replace <code>ID</code> with this plugin's installation number from Admin &gt; Plugins):</p>
      <pre>PUT /api/v2/admin/plugins/installations/ID/task-bindings/health_check
{"enabled": true, "trigger": {"type": "interval", "interval_ms": 300000}}

PUT /api/v2/admin/plugins/installations/ID/task-bindings/weekly_digest
{"enabled": true, "trigger": {"type": "weekly", "day_of_week": 0, "time_of_day": "18:00"}}</pre>
      <p class="help">Until a task has a schedule, Silo runs it once each time it starts. Both tasks need the read-only Silo key, and each admin switches the alerts on for themselves here. A health check tells you about a problem once, then again when it's fixed.</p>
    </details>`;
  }

  function limitRow(t, lim, id) {
    const v = adminDraft.limits[lim.key];
    const remote = t.key === "bandwidth"
      ? `<label class="switch"><input type="checkbox" data-remote-only${adminDraft.limits.bandwidth_remote_only ? " checked" : ""}>
          <span><span class="t">Count only remote streams</span><br><span class="d">For a limit on your upload: local streams don't use it.</span></span></label>`
      : "";
    const lid = `${id}_${lim.key}`;
    return `<div class="limit"><label for="${lid}">${esc(lim.label)}</label>
      <input type="number" id="${lid}" data-limit="${esc(lim.key)}" min="1" max="${esc(lim.max)}" step="1" inputmode="numeric" value="${esc(v || "")}"${lim.optional ? ` placeholder="off"` : ""}>
      <span class="muted">${esc(lim.unit)}</span>${remote}</div>`;
  }

  function libraryChecks() {
    const known = (adminData.libraries || []).map((l) => ({ value: l.id, label: l.name || "Library " + l.id }));
    // Keep libraries saved earlier that Silo no longer lists.
    adminDraft.filters.libraries.forEach((v) => { if (!known.some((m) => m.value === v)) known.push({ value: v, label: "Library " + v + " (not found)" }); });
    if (!known.length) return `<span class="help">Silo didn't list any libraries.</span>`;
    return known.map((m) =>
      `<label><input type="checkbox" data-library="${esc(m.value)}"${adminDraft.filters.libraries.includes(m.value) ? " checked" : ""}> ${esc(m.label)}</label>`).join("");
  }

  function updateAlertPreview(t) {
    const box = $(`#adminAlerts .type[data-alert="${CSS.escape(t.key)}"]`);
    if (!box) return;
    const a = adminDraft.alerts[t.key];
    const vars = { ...t.sample, type: t.key, type_label: t.label };
    $(".pt", box).textContent = render(a.title, vars) || "(no title)";
    $(".pm", box).textContent = render(a.message, vars) || "(no message)";
  }

  function mediaTypeChecks() {
    const known = adminData.media_types.map((m) => m);
    // Keep types saved earlier that this list doesn't offer.
    adminDraft.filters.media_types.forEach((v) => { if (!known.some((m) => m.value === v)) known.push({ value: v, label: v }); });
    return known.map((m) =>
      `<label><input type="checkbox" data-media="${esc(m.value)}"${adminDraft.filters.media_types.includes(m.value) ? " checked" : ""}> ${esc(m.label)}</label>`).join("");
  }

  function renderUserPick() {
    const slot = $("#userPick");
    if (!slot) return;
    const ignored = adminDraft.filters.ignore_users;
    const rows = adminUsers.map((u) => ({ id: u.id, name: u.username + (u.enabled ? "" : " (disabled)") }));
    ignored.forEach((id) => { if (!rows.some((r) => r.id === id)) rows.push({ id, name: `Unknown account (${id})` }); });
    let html = "";
    if (adminUsersError) {
      html += `<div class="help status-err">Couldn't load the list of accounts: ${esc(adminUsersError)} <button class="link" type="button" id="usersRetry">Try again</button></div>`;
    }
    html += rows.length
      ? `<div class="pick" role="group" aria-labelledby="ignoreLbl">${rows.map((r) =>
        `<label><input type="checkbox" data-user="${esc(r.id)}"${ignored.includes(r.id) ? " checked" : ""}> ${esc(r.name)}</label>`).join("")}</div>`
      : (adminUsersError ? "" : `<div class="help">No accounts to list.</div>`);
    slot.innerHTML = html;
    $$("[data-user]", slot).forEach((c) => c.addEventListener("change", () => {
      const list = adminDraft.filters.ignore_users.filter((id) => id !== c.dataset.user);
      if (c.checked) list.push(c.dataset.user);
      adminDraft.filters.ignore_users = list;
      markAdminDirty();
    }));
    const retry = $("#usersRetry", slot);
    if (retry) retry.addEventListener("click", async () => {
      retry.disabled = true;
      try {
        adminUsers = (await api("api/admin/users")).users || [];
        adminUsersError = "";
      } catch (e) {
        if (expired) return;
        if (isKeyProblem(e)) { showKeyOnly(e.code); return; }
        adminUsersError = e.message;
      }
      renderUserPick();
    });
  }

  function noiseChoice(m, current) {
    const h = NOISE_HELP[m.value] || { title: m.label, text: "" };
    return `<label class="choice"><input type="radio" name="noiseMode" value="${esc(m.value)}"${m.value === current ? " checked" : ""}>
      <span><span class="t">${esc(h.title)}</span><br><span class="d">${esc(h.text)}</span></span></label>`;
  }

  // Shows the window field for the modes that use it.
  function syncNoiseWindow() {
    const h = NOISE_HELP[adminDraft.noise.mode] || {};
    $("#noiseWindowField").hidden = !h.window;
    $("#noiseWindowLbl").textContent = h.window || "";
    $("#noiseWindowHelp").textContent = h.windowHelp || "";
  }

  function bindAdminAlerts() {
    $$("#adminAlerts .type").forEach((box) => {
      const t = adminData.alert_types.find((x) => x.key === box.dataset.alert);
      const a = adminDraft.alerts[t.key];
      $$("[data-k]", box).forEach((input) => {
        const k = input.dataset.k;
        const ev = input.tagName === "SELECT" || input.type === "checkbox" ? "change" : "input";
        input.addEventListener(ev, () => {
          if (k === "enabled") {
            a.enabled = input.checked;
            // An alert that follows this one's switch.
            adminData.alert_types.filter((x) => x.parent === t.key).forEach((x) => { adminDraft.alerts[x.key].enabled = a.enabled; });
          }
          else if (k === "priority") a.priority = input.value === "" ? null : Number(input.value);
          else a[k] = input.value;
          markAdminDirty();
          updateAlertPreview(t);
        });
        if (k === "title" || k === "message") input.addEventListener("focus", () => (adminField = input));
      });
      $$("[data-insert]", box).forEach((chip) => chip.addEventListener("click", () => {
        const target = adminField && box.contains(adminField) ? adminField : $("[data-k=message]", box);
        const s = target.selectionStart ?? target.value.length, e = target.selectionEnd ?? s;
        target.value = target.value.slice(0, s) + chip.dataset.insert + target.value.slice(e);
        target.focus();
        target.setSelectionRange(s + chip.dataset.insert.length, s + chip.dataset.insert.length);
        target.dispatchEvent(new Event("input"));
      }));
      $("[data-reset]", box).addEventListener("click", () => {
        a.title = t.default_title; a.message = t.default_message;
        $("[data-k=title]", box).value = a.title;
        $("[data-k=message]", box).value = a.message;
        markAdminDirty();
        updateAlertPreview(t);
      });
      $("[data-test]", box).addEventListener("click", (e) => sendAdminTest(t, e.target, $("[data-test-msg]", box)));
    });

    const f = adminDraft.filters;
    $("#fRemote").addEventListener("change", (e) => { f.only_remote = e.target.checked; markAdminDirty(); });
    $("#fTranscode").addEventListener("change", (e) => { f.only_transcodes = e.target.checked; markAdminDirty(); });
    $$("[data-media]").forEach((c) => c.addEventListener("change", () => {
      f.media_types = f.media_types.filter((v) => v !== c.dataset.media);
      if (c.checked) f.media_types.push(c.dataset.media);
      markAdminDirty();
    }));
    $$("#adminAlerts [data-library]").forEach((c) => c.addEventListener("change", () => {
      f.libraries = f.libraries.filter((v) => v !== c.dataset.library);
      if (c.checked) f.libraries.push(c.dataset.library);
      markAdminDirty();
    }));
    $$("#adminAlerts [data-limit]").forEach((input) => input.addEventListener("input", () => {
      adminDraft.limits[input.dataset.limit] = input.value === "" ? 0 : Math.round(Number(input.value));
      markAdminDirty();
    }));
    $$("#adminAlerts [data-remote-only]").forEach((c) => c.addEventListener("change", () => {
      adminDraft.limits.bandwidth_remote_only = c.checked;
      markAdminDirty();
    }));
    $$("input[name=noiseMode]").forEach((r) => r.addEventListener("change", () => {
      adminDraft.noise.mode = r.value;
      syncNoiseWindow();
      markAdminDirty();
    }));
    $("#noiseWindow").addEventListener("input", (e) => {
      adminDraft.noise.window_minutes = e.target.value === "" ? 0 : Math.round(Number(e.target.value));
      markAdminDirty();
    });
    $("#adminSave").addEventListener("click", saveAdmin);
    $("#adminRemove").addEventListener("click", removeAdmin);
  }

  function adminPayload() {
    return { alerts: adminDraft.alerts, filters: adminDraft.filters, noise: adminDraft.noise, limits: adminDraft.limits };
  }

  // Returns a message when the noise window can't be saved.
  function noiseWindowProblem() {
    const n = adminDraft.noise;
    if (!(NOISE_HELP[n.mode] || {}).window) return "";
    if (!Number.isFinite(n.window_minutes) || n.window_minutes < 1 || n.window_minutes > 1440) return "Enter a time between 1 and 1440 minutes.";
    return "";
  }

  async function sendAdminTest(t, btn, out) {
    btn.disabled = true;
    out.className = "help"; out.textContent = "Sending…";
    try {
      await api("api/admin/alerts/test", "POST", { settings: adminPayload(), alert: t.key });
      out.className = "help status-ok"; out.textContent = "Sent. Check your device.";
    } catch (e) {
      if (expired) return;
      if (isKeyProblem(e)) { showKeyOnly(e.code); return; }
      out.className = "help status-err"; out.textContent = e.message;
    } finally {
      btn.disabled = expired;
    }
  }

  // Returns [message, input] when a limit can't be saved.
  function limitProblem() {
    for (const t of adminData.alert_types) {
      for (const lim of t.limits || []) {
        const v = adminDraft.limits[lim.key] || 0;
        const input = $(`#adminAlerts [data-limit="${CSS.escape(lim.key)}"]`);
        if (!Number.isFinite(v) || v < 0 || v > lim.max) return [`${t.label}: enter a limit between 1 and ${lim.max}${lim.optional ? ", or leave it empty" : ""}.`, input];
        if (!lim.optional && adminDraft.alerts[t.key].enabled && !v) return [`${t.label}: set a limit, or switch the alert off.`, input];
      }
    }
    return null;
  }

  async function saveAdmin() {
    const btn = $("#adminSave");
    const problem = noiseWindowProblem();
    if (problem) { adminMessage(problem, "err"); $("#noiseWindow").focus(); return; }
    const lp = limitProblem();
    if (lp) { adminMessage(lp[0], "err"); if (lp[1]) lp[1].focus(); return; }
    btn.disabled = true;
    adminMessage("Saving…");
    try {
      const res = await api("api/admin/alerts", "PUT", adminPayload());
      adminData.configured = true;
      adminData.settings = res.settings;
      adminDraft = draftFrom(res.settings);
      adminDirty = false;
      renderAdminAlerts();
      if (res.warning) adminMessage(res.warning, "err"); else adminMessage("Saved", "ok");
    } catch (e) {
      if (expired) return;
      if (isKeyProblem(e)) { showKeyOnly(e.code); return; }
      adminMessage(e.message, "err");
    } finally {
      const b = $("#adminSave");
      if (b) b.disabled = expired;
    }
  }

  async function removeAdmin() {
    if (!confirm("Turn off your admin alerts and forget these settings?")) return;
    try {
      await api("api/admin/alerts", "DELETE");
      await loadAdmin();
      adminMessage("Removed", "ok");
    } catch (e) {
      if (expired) return;
      if (isKeyProblem(e)) { showKeyOnly(e.code); return; }
      adminMessage(e.message, "err");
    }
  }

  function renderKeys() {
    const box = $("#adminKeys");
    const k = state && state.admin_keys;
    if (!box || !k) return;
    // Re-rendering mustn't lose the last result or the form's state.
    const keepResult = $("#setupResult") ? $("#setupResult").innerHTML : "";
    const keepControl = $("#setupControl") ? $("#setupControl").checked : false;
    const keepOpen = $("#keyDetails") ? $("#keyDetails").open : false;
    const needsKey = adminState === "key";
    const status = (set, label, bad) => `<li>${esc(label)}: ${set ? (bad ? `<span class="status-err">${esc(bad)}</span>` : '<span class="status-ok">saved</span>') : '<span class="muted">not set</span>'}</li>`;
    const badMonitor = needsKey && adminProblem === "monitor_key_rejected" ? "saved, but Silo rejected it"
      : needsKey && adminProblem === "monitor_key_scope" ? "saved, but it can't look up accounts" : "";
    const action = k.monitor_key_set ? "Replace the read-only key" : "Set up the read-only key";
    box.innerHTML = `
      <section class="card" aria-labelledby="adminTitle">
        <h2 id="adminTitle">Silo keys<span class="badge">Admin</span></h2>
        <p class="sub">The plugin reads from Silo with a key that can only read (scope admin:monitor:read). With it, each account's primary profile can set up Pushover for every profile on the account, and admin alerts can check that each recipient is still an admin. Only server admins see this section.</p>
        ${needsKey ? `<div class="notice warn"><strong>Admin alerts are off for now.</strong> ${esc(KEY_PROBLEMS[adminProblem] || KEY_PROBLEMS.monitor_key_missing)}</div>` : ""}
        <ul class="keylist">${status(k.monitor_key_set, "Read-only key", badMonitor)}${status(k.control_key_set, "Stream-control key")}</ul>
        ${k.monitor_key_set && !needsKey ? `<p class="help"><a href="admin/sessions">Live streams</a>: see who's streaming${k.control_key_set ? " and stop a stream, with or without a message" : ". To stop streams from there, also set up the stream-control key below"}.</p>` : ""}
        ${k.legacy_key_stored ? `
        <div class="notice warn"><strong>The full-access key from version 0.2.0 is still stored.</strong>
          The plugin no longer uses it. It can use it one last time to create the read-only key, and then revokes it in Silo.
          <div class="actions"><button class="btn primary" type="button" id="legacyBtn">Replace the old full-access key</button></div>
        </div>` : ""}
        <details class="plain" id="keyDetails"${needsKey || keepOpen ? " open" : ""}>
          <summary>${action}</summary>
          <div class="field">
            <label class="lbl" for="setupKey">Full-access Silo API key</label>
            <input type="password" id="setupKey" autocomplete="off" spellcheck="false" placeholder="sa_…">
            <div class="help">Create one under Admin &gt; API Keys and paste it here. The plugin uses it once to create a key on your account with only the admin:monitor:read scope, and doesn't keep it.</div>
          </div>
          <div class="checks">
            <label class="switch"><input type="checkbox" id="setupRevoke" checked>
              <span><span class="t">Delete this key from Silo</span><br><span class="d">Revokes the key you pasted once the new key is saved and working.</span></span></label>
            <label class="switch"><input type="checkbox" id="setupControl"${keepControl ? " checked" : ""}>
              <span><span class="t">Also allow stopping streams</span><br><span class="d">Also creates a separate key with the admin:sessions:control scope, for stopping streams from the Live streams page.${k.legacy_key_stored ? " Applies to the old-key button too." : ""}</span></span></label>
          </div>
          <div class="actions"><button class="btn primary" type="button" id="setupBtn">${action}</button></div>
        </details>
        <div id="setupResult" role="status" aria-live="polite">${keepResult}</div>
      </section>`;
    $("#setupBtn").addEventListener("click", () => runSetup("paste"));
    const legacy = $("#legacyBtn");
    if (legacy) legacy.addEventListener("click", () => runSetup("legacy"));
  }

  function showSetupResult(kind, title, details) {
    $("#setupResult").innerHTML = `<div class="notice ${kind}"><strong>${esc(title)}</strong>${details.length ? `<ul>${details.map((d) => `<li>${esc(d)}</li>`).join("")}</ul>` : ""}</div>`;
  }

  async function runSetup(source) {
    const body = { source, control: $("#setupControl").checked };
    const pasted = $("#setupKey").value.trim();
    if (source === "paste") {
      if (!pasted) { showSetupResult("error", "Paste a full-access Silo API key first.", []); $("#setupKey").focus(); return; }
      body.key = pasted;
      body.revoke = $("#setupRevoke").checked;
    } else if (!confirm("Use the old full-access key to create the read-only key, then revoke the old key in Silo?")) {
      return;
    }
    $$("#adminKeys input, #adminKeys button").forEach((e) => (e.disabled = true));
    $("#setupResult").innerHTML = `<p class="help">Setting up the key. This takes a few seconds…</p>`;
    let res = null, error = null;
    try { res = await api("api/admin/key-setup", "POST", body); } catch (e) { error = e; }
    if (expired) return;
    if (res) {
      state.admin_keys = res.keys;
    } else {
      // A request that timed out may still have finished on the server.
      try { const fresh = await api("api/state"); if (fresh.admin_keys) state.admin_keys = fresh.admin_keys; } catch { /* keep the old status */ }
      if (expired) return;
    }
    renderKeys();
    if (res) {
      const details = [...(res.details || [])];
      if (res.saved) details.push("Reload this page to manage every profile on your account from here.");
      showSetupResult(res.level === "warn" ? "warn" : "ok", res.title, details);
    } else {
      if (source === "paste") $("#setupKey").value = pasted;
      showSetupResult("error", "The key setup didn't finish.", [error.message]);
    }
    // A new key may make the alert settings available (or fix a broken key).
    if (state.admin_keys.monitor_key_set && (res ? res.saved : true) && adminState !== "ready") loadAdmin();
  }

  window.addEventListener("beforeunload", (e) => { if ((dirty || adminDirty) && !expired) e.preventDefault(); });

  init();
})();
</script>
</body>
</html>
